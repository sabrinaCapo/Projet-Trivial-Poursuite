version: 2

models:
  - name: stg_questions_llm
    description: Questions et réponses du modèle (silver), nettoyées et dédupliquées.
    columns:
      - name: question
        tests: [not_null]
      - name: correct_answer
        tests: [not_null]
      - name: type
        tests:
          - accepted_values:
              values: ['multiple', 'boolean']
      - name: difficulty
        tests:
          - accepted_values:
              values: ['easy', 'medium', 'hard']
      - name: is_correct
        tests: [not_null]
      - name: error_type
        tests:
          - accepted_values:
              values: ['correct', 'plausible_wrong_choice', 'hallucination_out_of_options']
